# Stack pengembangan lokal FTM: MySQL dan penangkap email.
#
# Hanya untuk laptop pengembang. Nilai di bawah adalah contoh lokal, bukan
# kredensial produksi. Aplikasi tidak pernah boleh diarahkan ke database
# produksi dari mesin pengembang.
#
# Menyalakan:  docker compose -f deploy/local/compose.yaml up -d
# Mematikan:   docker compose -f deploy/local/compose.yaml stop
# Reset data:  docker compose -f deploy/local/compose.yaml down -v
name: ftm-local

services:
  mysql:
    # Disamakan dengan versi MySQL yang dipakai pilot (per Oktober 2026).
    image: mysql:8.4.8
    environment:
      MYSQL_ROOT_PASSWORD: ftm-local-root
      MYSQL_DATABASE: ftm_local
      MYSQL_USER: ftm_local
      MYSQL_PASSWORD: ftm-local-pass
      TZ: UTC
    ports:
      - "127.0.0.1:${FTM_LOCAL_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pftm-local-root"]
      interval: 5s
      timeout: 5s
      retries: 30

  mail:
    # Menangkap semua email aplikasi (OTP, verifikasi, tautan paket firmware)
    # supaya tidak ada email yang terkirim ke orang sungguhan.
    image: axllent/mailpit:v1.27.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${FTM_LOCAL_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${FTM_LOCAL_MAIL_UI_PORT:-8026}:8025"

volumes:
  mysql-data:
