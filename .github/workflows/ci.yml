name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

  integration:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        # Disamakan dengan versi MySQL pilot per Oktober 2026.
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: ftm-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pftm-ci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Setiap berkas tes membuat database sementara di MySQL layanan CI,
      # menerapkan migrasi 001-009, lalu menghapusnya.
      - name: Run integration tests
        env:
          FTM_TEST_MYSQL_URL: mysql://root:ftm-ci-root@127.0.0.1:3306
        run: pnpm test:integration

  pr-title:
    name: Pull request title format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Judul pull request menjadi pesan commit saat squash merge.
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      # Tanpa cache: job ini tidak memasang dependensi, jadi folder cache pnpm
      # tidak pernah ada dan langkah penyimpanan cache akan gagal.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Hanya melaporkan sampai pembaruan dependensi keamanan selesai: hasilnya
      # ditulis ke ringkasan job dan job tetap hijau. Setelah itu langkah ini
      # dibuat wajib lulus.
      - name: Audit production dependencies (high and critical)
        run: |
          set +e
          pnpm audit --prod --audit-level high > audit.txt 2>&1
          status=$?
          {
            echo "## Audit dependensi produksi"
            echo ""
            echo '```text'
            tail -n 5 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Audit dependensi::Ada kerentanan tingkat tinggi atau kritis. Lihat ringkasan job."
          fi
          exit 0
