version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      # Dipisah: kelompok produksi baru digabung setelah perilaku aplikasi dibuktikan sama.
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Versi mayor @types/node mengikuti versi Node.js di .nvmrc, bukan versi terbaru.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
